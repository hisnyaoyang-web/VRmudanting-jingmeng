<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d98a3c'/%3E%3Ccircle cx='16' cy='14' r='8' fill='%232a1220'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>梦入牡丹亭 · 寻回杜丽娘</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 舞台：单一连续长卷。左半闺房（场景1），右半花园（场景2），中间接缝分隔。
         每个场景由后景 / 中后景 / 前景三层已对齐的图片叠加，角色只在角色轨道左右移动。 -->
    <div id="stage">
      <div class="panorama">
        <!-- 后景轨道（最远） -->
        <div class="layer layer-back" data-depth="0.03">
          <div class="half s1-back"></div>
          <div class="half theatre-half"></div>
          <div class="half s2-back"></div>
        </div>

        <!-- 中后景轨道 -->
        <div class="layer layer-mid" data-depth="0.06">
          <div class="half s1-mid"></div>
          <div class="half theatre-half"></div>
          <div class="half s2-mid" data-chroma="/scenes/s2-mid.png"></div>
        </div>

        <!-- 角色轨道（皮影人偶，左右移动只在此层） -->
        <div id="puppet-layer"></div>

        <!-- 前景轨道（最近，遮在角色之前） -->
        <div class="layer layer-front" data-depth="0.11">
          <div class="half s1-front"></div>
          <div class="half theatre-half"></div>
          <div class="half s2-front" data-chroma="/scenes/s2-front.png"></div>
        </div>

        <!-- 两幕接缝的折纸阴影（随长卷平移） -->
        <div class="seam" aria-hidden="true"></div>

        <!-- 两幕之间的剪纸屏柱：遮挡角色与场景接缝，角色可穿行其下 -->
        <div class="scene-screen" aria-hidden="true">
          <svg class="screen-svg" viewBox="0 0 180 1000" preserveAspectRatio="xMidYMid meet">
            <!-- 顶冠 -->
            <path d="M8 46 Q90 4 172 46 L160 84 L20 84 Z" fill="#5c120f" stroke="#d9a03f" stroke-width="2.5"/>
            <rect x="20" y="84" width="140" height="14" fill="#3a0f0c" stroke="#d9a03f" stroke-width="2"/>
            <!-- 屏面半透背板（遮挡但可见穿行） -->
            <rect x="28" y="100" width="124" height="790" fill="#1f0a09" opacity="0.6"/>
            <rect x="28" y="100" width="124" height="790" fill="none" stroke="#d9a03f" stroke-width="3"/>
            <!-- 棂格 -->
            <g stroke="#a9762c" stroke-width="2" opacity="0.85">
              <line x1="59" y1="108" x2="59" y2="882"/>
              <line x1="90" y1="108" x2="90" y2="882"/>
              <line x1="121" y1="108" x2="121" y2="882"/>
              <line x1="28" y1="232" x2="152" y2="232"/>
              <line x1="28" y1="362" x2="152" y2="362"/>
              <line x1="28" y1="628" x2="152" y2="628"/>
              <line x1="28" y1="758" x2="152" y2="758"/>
            </g>
            <!-- 中央月洞 -->
            <circle cx="90" cy="495" r="52" fill="#150705" opacity="0.55" stroke="#d9a03f" stroke-width="3"/>
            <circle cx="90" cy="495" r="52" fill="none" stroke="#f0c060" stroke-width="1" opacity="0.7"/>
            <!-- 月洞内折枝牡丹 -->
            <g fill="none" stroke="#d9a03f" stroke-width="1.5" opacity="0.85" transform="translate(90 495)">
              <path d="M0 -30 C12 -20 12 -6 0 0 C-12 -6 -12 -20 0 -30 Z"/>
              <path d="M0 30 C12 20 12 6 0 0 C-12 6 -12 20 0 30 Z"/>
              <path d="M-30 0 C-20 -12 -6 -12 0 0 C-6 12 -20 12 -30 0 Z"/>
              <path d="M30 0 C20 -12 6 -12 0 0 C6 12 20 12 30 0 Z"/>
              <circle cx="0" cy="0" r="4" fill="#f0c060" stroke="none" opacity="0.9"/>
            </g>
            <!-- 底座 -->
            <rect x="22" y="886" width="136" height="16" fill="#3a0f0c" stroke="#d9a03f" stroke-width="2"/>
            <path d="M12 902 L168 902 L160 936 L20 936 Z" fill="#241008" stroke="#d9a03f" stroke-width="2"/>
            <rect x="4" y="936" width="172" height="22" rx="3" fill="#180b07" stroke="#d9a03f" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="scene-screen screen-2" aria-hidden="true">
          <svg class="screen-svg" viewBox="0 0 180 1000" preserveAspectRatio="xMidYMid meet">
            <!-- 顶冠 -->
            <path d="M8 46 Q90 4 172 46 L160 84 L20 84 Z" fill="#5c120f" stroke="#d9a03f" stroke-width="2.5"/>
            <rect x="20" y="84" width="140" height="14" fill="#3a0f0c" stroke="#d9a03f" stroke-width="2"/>
            <!-- 屏面半透背板（遮挡但可见穿行） -->
            <rect x="28" y="100" width="124" height="790" fill="#1f0a09" opacity="0.6"/>
            <rect x="28" y="100" width="124" height="790" fill="none" stroke="#d9a03f" stroke-width="3"/>
            <!-- 棂格 -->
            <g stroke="#a9762c" stroke-width="2" opacity="0.85">
              <line x1="59" y1="108" x2="59" y2="882"/>
              <line x1="90" y1="108" x2="90" y2="882"/>
              <line x1="121" y1="108" x2="121" y2="882"/>
              <line x1="28" y1="232" x2="152" y2="232"/>
              <line x1="28" y1="362" x2="152" y2="362"/>
              <line x1="28" y1="628" x2="152" y2="628"/>
              <line x1="28" y1="758" x2="152" y2="758"/>
            </g>
            <!-- 中央月洞 -->
            <circle cx="90" cy="495" r="52" fill="#150705" opacity="0.55" stroke="#d9a03f" stroke-width="3"/>
            <circle cx="90" cy="495" r="52" fill="none" stroke="#f0c060" stroke-width="1" opacity="0.7"/>
            <!-- 月洞内折枝牡丹 -->
            <g fill="none" stroke="#d9a03f" stroke-width="1.5" opacity="0.85" transform="translate(90 495)">
              <path d="M0 -30 C12 -20 12 -6 0 0 C-12 -6 -12 -20 0 -30 Z"/>
              <path d="M0 30 C12 20 12 6 0 0 C-12 6 -12 20 0 30 Z"/>
              <path d="M-30 0 C-20 -12 -6 -12 0 0 C-6 12 -20 12 -30 0 Z"/>
              <path d="M30 0 C20 -12 6 -12 0 0 C6 12 20 12 30 0 Z"/>
              <circle cx="0" cy="0" r="4" fill="#f0c060" stroke="none" opacity="0.9"/>
            </g>
            <!-- 底座 -->
            <rect x="22" y="886" width="136" height="16" fill="#3a0f0c" stroke="#d9a03f" stroke-width="2"/>
            <path d="M12 902 L168 902 L160 936 L20 936 Z" fill="#241008" stroke="#d9a03f" stroke-width="2"/>
            <rect x="4" y="936" width="172" height="22" rx="3" fill="#180b07" stroke="#d9a03f" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 氛围叠加：暗角 / 颗粒 -->
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <!-- 舞台幕框 -->
    <div class="stage-frame" aria-hidden="true">
      <div class="valance valance-top"></div>
      <div class="valance valance-bottom"></div>
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
    </div>

    <!-- 暗场 -->
    <div id="stage-dim"></div>

    <!-- 操作提示 -->
    <div id="hint" class="hint hidden">
      <span class="hint-key">&larr;</span><span class="hint-key">&rarr;</span> 左右移动
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
