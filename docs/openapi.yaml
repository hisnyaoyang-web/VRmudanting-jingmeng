openapi: 3.1.0
info:
  title: Shadowplay dGame API
  version: 2026-07-25
  description: Versioned API for verified runs, persistent progress, leaderboards and NFT claims.
servers:
  - url: /
paths:
  /api/v1/runs/start:
    post:
      operationId: startRun
      summary: Create a server-timestamped performance run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storyId, difficulty]
              properties:
                storyId: { type: string, example: moongate-night }
                difficulty: { $ref: "#/components/schemas/Difficulty" }
      responses:
        "201":
          description: Run created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartRunResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/runs/finish:
    post:
      operationId: finishRun
      summary: Recalculate and persist a run from its input event stream.
      description: A run can be finished once. The body is limited to 32 KiB and 128 events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId, events]
              properties:
                runId: { type: string, format: uuid }
                address: { $ref: "#/components/schemas/Address" }
                events:
                  type: array
                  maxItems: 128
                  items: { $ref: "#/components/schemas/RunInput" }
      responses:
        "200":
          description: Authoritative score and optional EIP-712 voucher.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinishRunResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Run was already finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: Run duration was implausible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/leaderboard:
    get:
      operationId: getLeaderboard
      summary: Return best verified score per wallet for a season.
      parameters:
        - { in: query, name: storyId, schema: { type: string, default: moongate-night } }
        - { in: query, name: seasonId, schema: { type: string, pattern: '^[0-9]{4}-S[0-9]{2}$' } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Leaderboard snapshot, publicly cached for 30 seconds.
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/progress/{address}:
    get:
      operationId: getProgress
      summary: Return cross-device progress and unlocks for a wallet.
      parameters:
        - in: path
          name: address
          required: true
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200": { description: Player progress. }
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  schemas:
    Difficulty:
      type: string
      enum: [apprentice, stage, master]
    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
    Grade:
      type: string
      enum: [bad, good, excellent]
    RunInput:
      type: object
      additionalProperties: false
      required: [action, atMs]
      properties:
        action:
          type: string
          enum: [left, right, up, down, salute, run, flying]
        atMs: { type: integer, minimum: -500, maximum: 125000 }
    Voucher:
      type: object
      required: [player, storyId, seasonId, score, grade, nonce, deadline, signature]
      properties:
        player: { $ref: "#/components/schemas/Address" }
        storyId: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        seasonId: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        score: { type: integer, minimum: 0 }
        grade: { type: integer, minimum: 0, maximum: 2 }
        nonce: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        deadline: { type: string, pattern: "^[0-9]+$" }
        signature: { type: string, pattern: "^0x[0-9a-fA-F]+$" }
    StartRunResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
    FinishRunResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data: { type: object }
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, NOT_FOUND, CONFLICT, NOT_ELIGIBLE, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string }
            details: {}
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: Required persistence or signing service is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
